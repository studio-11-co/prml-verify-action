name: Action self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate action.yml
        run: |
          python -c "
          import yaml, sys
          d = yaml.safe_load(open('action.yml'))
          assert d['runs']['using'] == 'composite', 'must be composite'
          for s in d['runs']['steps']:
              assert 'name' in s
          print('action.yml OK — name=' + d['name'])
          print('inputs:', list(d['inputs'].keys()))
          print('outputs:', list(d['outputs'].keys()))
          "

  smoke-test-guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install falsify and seed a sample claim
        run: |
          pip install falsify==0.1.3
          falsify --version
          falsify init smoke-claim
          # auto-edit threshold + metric for a deterministic locked spec
          python -c "
          import yaml, pathlib
          p = pathlib.Path('.falsify/smoke-claim/spec.yaml')
          d = yaml.safe_load(p.read_text())
          d['metric'] = 'accuracy'
          d['threshold'] = 0.5
          d['claim'] = 'smoke test for prml-verify-action'
          p.write_text(yaml.safe_dump(d, sort_keys=False))
          "
          falsify lock smoke-claim
      - name: Run guard via the local action
        uses: ./
        with:
          mode: guard
