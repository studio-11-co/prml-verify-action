name: Action self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate action.yml
        run: |
          python -c "
          import yaml, sys
          d = yaml.safe_load(open('action.yml'))
          assert d['runs']['using'] == 'composite', 'must be composite'
          for s in d['runs']['steps']:
              assert 'name' in s
          print('action.yml OK — name=' + d['name'])
          print('inputs:', list(d['inputs'].keys()))
          print('outputs:', list(d['outputs'].keys()))
          "

  smoke-test-guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install falsify (PyPI + data-file workaround, see action.yml note) and seed a sample claim
        run: |
          pip install falsify==0.1.3
          SITE_PKG=$(python -c "import falsify, os; print(os.path.dirname(falsify.__file__))")
          curl -fsSL "https://raw.githubusercontent.com/studio-11-co/falsify/v0.1.3/hypothesis.schema.yaml" -o "${SITE_PKG}/hypothesis.schema.yaml"
          mkdir -p "${SITE_PKG}/examples"
          curl -fsSL "https://raw.githubusercontent.com/studio-11-co/falsify/v0.1.3/examples/template.yaml" -o "${SITE_PKG}/examples/template.yaml" || true
          falsify --version
          mkdir -p .falsify/smoke-claim
          cat > .falsify/smoke-claim/spec.yaml <<'EOF'
          version: prml/0.1
          metric: accuracy
          threshold: 0.5
          dataset_split: smoke-split
          model_version: smoke-v1
          claim: smoke test for prml-verify-action
          submitter: ci
          timestamp: 2026-05-08T07:00:00Z
          EOF
          falsify lock smoke-claim
      - name: Run guard via the local action
        uses: ./
        with:
          mode: guard
