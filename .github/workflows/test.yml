name: Action self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate action.yml
        run: |
          python -c "
          import yaml, sys
          d = yaml.safe_load(open('action.yml'))
          assert d['runs']['using'] == 'composite', 'must be composite'
          for s in d['runs']['steps']:
              assert 'name' in s
          print('action.yml OK — name=' + d['name'])
          print('inputs:', list(d['inputs'].keys()))
          print('outputs:', list(d['outputs'].keys()))
          "

  cli-smoke-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: End-to-end falsify install + lock
        # falsify 0.1.4 ships hypothesis.schema.yaml and examples/template.yaml
        # inlined as Python string constants (_BUNDLED_*), so `pip install`
        # is enough — no companion-file fetch required.
        run: |
          pip install falsify==0.1.4
          falsify --version
          mkdir -p .falsify/smoke-claim
          cat > .falsify/smoke-claim/spec.yaml <<'EOF'
          claim: smoke test for prml-verify-action
          falsification:
            failure_criteria:
              - metric: accuracy
                direction: above
                threshold: 0.5
            minimum_sample_size: 10
            stopping_rule: after 100 samples
          experiment:
            command: echo OK
            dataset: mock
            metric_fn: m:f
          EOF
          falsify lock smoke-claim
          echo "End-to-end install + lock OK"
