name: Action self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate action.yml
        run: |
          python -c "
          import yaml, sys
          d = yaml.safe_load(open('action.yml'))
          assert d['runs']['using'] == 'composite', 'must be composite'
          for s in d['runs']['steps']:
              assert 'name' in s
          print('action.yml OK — name=' + d['name'])
          print('inputs:', list(d['inputs'].keys()))
          print('outputs:', list(d['outputs'].keys()))
          "

  cli-smoke-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install falsify and verify CLI loads
        # End-to-end `falsify lock` is gated on falsify 0.1.4 shipping with
        # bundled data files (hypothesis.schema.yaml + examples/template.yaml)
        # via [tool.setuptools.package-data]. Until then, this job verifies
        # the Action's install path is healthy and the CLI is importable —
        # actual `lock`/`guard` flows are exercised in the falsify repo's
        # own CI.
        run: |
          pip install falsify==0.1.3
          SITE_PKG=$(python -c "import falsify, os; print(os.path.dirname(falsify.__file__))")
          curl -fsSL "https://raw.githubusercontent.com/studio-11-co/falsify/v0.1.3/hypothesis.schema.yaml" -o "${SITE_PKG}/hypothesis.schema.yaml"
          falsify --version
          falsify --help | head -5
          echo "CLI imports + help dispatch OK"
