name: 'PRML Verify'
description: 'Verify PRML commitments in CI. Block merges on tampered or regressed eval claims. Optional public registry anchor.'
author: 'Cüneyt Öztürk'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  mode:
    description: |
      Verification mode:
      - "manifest": verify a PRML manifest's SHA-256 (hash/tamper) and, if
        `observed` is set, evaluate the predicate. Requires `manifest-path`.
        This is the PRML-manifest verifier — runs the `falsify` reference CLI.
        Exit 0 PASS · 3 TAMPERED (hash mismatch) · 10 FAIL (below threshold).
      - "guard" (default): scan all .falsify/ claims via the workflow engine,
        fail on any FAIL/STALE.
      - "verdict": check one engine claim by name (requires `claim` input).
      - "lock": hash and freeze an engine claim (rare in CI).
      - "schema-only": validate a PRML YAML against the v0.1 / v0.2-RFC JSON
        Schema (shape only, no hash). Requires `manifest-path`.
      Note: guard/verdict/lock drive the `falsify-engine` workflow CLI;
      manifest/schema-only operate on a standalone `*.prml.yaml`.
    required: false
    default: 'guard'

  claim:
    description: 'Claim name (required when mode=verdict or mode=lock)'
    required: false
    default: ''

  manifest-path:
    description: |
      Path to a PRML manifest YAML (required when mode=manifest or
      mode=schema-only). Relative to working-directory.
    required: false
    default: ''

  observed:
    description: |
      Observed metric value (mode=manifest). If set, the action evaluates the
      manifest's predicate and exits 10 (FAIL) if it does not hold.
    required: false
    default: ''

  schema-version:
    description: |
      PRML schema version to validate against in mode=schema-only.
      One of: "v0.1" (default, stable) or "v0.2-rfc" (open through 2026-05-22).
    required: false
    default: 'v0.1'

  expected-hash:
    description: |
      Expected SHA-256 hash to verify against. If set and the computed hash
      mismatches, the action exits 3 (TAMPER). Useful to pin a specific
      registry-anchored claim across CI runs.
    required: false
    default: ''

  anchor-to-registry:
    description: |
      If "true", also POST the manifest to the public registry (default:
      registry.falsify.dev) and surface the permalink as an output. The
      manifest sent is `manifest-path` when set (mode=manifest or
      schema-only), otherwise `.falsify/<claim>/spec.yaml` (mode=verdict or
      lock). Skipped on tamper. Defaults to "false": only enable when you
      want a public receipt.
    required: false
    default: 'false'

  registry-url:
    description: 'Public PRML registry endpoint (used only when anchor-to-registry=true).'
    required: false
    default: 'https://registry.falsify.dev'

  registry-handle:
    description: 'Submitter handle to attach to the registry commit (defaults to GitHub repo owner).'
    required: false
    default: ''

  attest:
    description: |
      If "true" (mode=manifest only), also create a GitHub artifact attestation
      (Sigstore-signed, via actions/attest) whose subject is the manifest's
      canonical bytes, so its SHA-256 is the PRML hash, with the PRML predicate
      (predicate type https://falsify.dev/prml/v<version>). Anyone can then check
      it with `gh attestation verify <canonical-file> --repo <owner/repo>
      --predicate-type https://falsify.dev/prml/v0.1`. The calling job needs
      `permissions: { id-token: write, attestations: write, contents: read }`;
      private repositories need a plan with artifact attestations. Runs only
      when verification succeeded.
    required: false
    default: 'false'

  python-version:
    description: 'Python version used to run falsify.'
    required: false
    default: '3.11'

  falsify-version:
    description: 'Version of the single `falsify` PyPI package, pinned for reproducibility (default: 0.5.1; requires Python 3.11 or later). That one package provides both commands used here: the `falsify` PRML CLI and the `falsify-engine` command. There is no separate `falsify-engine` package to install.'
    required: false
    default: '0.5.1'

  working-directory:
    description: 'Path to the repository root that contains .falsify/.'
    required: false
    default: '.'

outputs:
  hash:
    description: 'SHA-256 digest of the canonical manifest bytes.'
    value: ${{ steps.run.outputs.hash }}
  permalink:
    description: 'Registry permalink (only set when anchor-to-registry=true and registry POST succeeded).'
    value: ${{ steps.run.outputs.permalink }}
  status:
    description: 'Final status: pass / fail / tamper / inconclusive.'
    value: ${{ steps.run.outputs.status }}
  badge-snippet:
    description: 'Markdown snippet for embedding the registry badge in a README.'
    value: ${{ steps.run.outputs.badge-snippet }}
  attestation-url:
    description: 'URL of the GitHub artifact attestation (only set when attest=true).'
    value: ${{ steps.attest.outputs.attestation-url }}
  canonical-path:
    description: 'Path of the canonical-bytes file that the attestation is about (only set when attest=true).'
    value: ${{ steps.attest-prep.outputs.subject-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install falsify
      shell: bash
      env:
        FALSIFY_VERSION: ${{ inputs.falsify-version }}
      run: |
        set -euo pipefail
        if ! printf '%s' "$FALSIFY_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$'; then
          echo "::error::Invalid falsify-version '$FALSIFY_VERSION' (expected semver, e.g. 0.5.1)."
          exit 2
        fi
        python -m pip install --quiet --upgrade pip
        pip install --quiet "falsify==${FALSIFY_VERSION}" jsonschema pyyaml
        falsify --version

    - name: Verify
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PRML_MODE: ${{ inputs.mode }}
        PRML_CLAIM: ${{ inputs.claim }}
        PRML_EXPECTED_HASH: ${{ inputs.expected-hash }}
        PRML_MANIFEST_PATH: ${{ inputs.manifest-path }}
        PRML_OBSERVED: ${{ inputs.observed }}
        PRML_SCHEMA_VERSION: ${{ inputs.schema-version }}
        PRML_ANCHOR: ${{ inputs.anchor-to-registry }}
        PRML_REGISTRY: ${{ inputs.registry-url }}
        PRML_HANDLE: ${{ inputs.registry-handle }}
        GH_REPO_OWNER: ${{ github.repository_owner }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        # GitHub invokes composite `shell: bash` with -e (errexit). This script
        # is built around capturing `EXIT=$?` from falsify (which returns 3/10
        # on TAMPER/FAIL by design), so errexit must be OFF or those non-zero
        # results abort the step before the status is mapped. Keep pipefail.
        set +e -o pipefail

        # Resolve handle (input wins, otherwise GitHub repo owner)
        HANDLE="${PRML_HANDLE:-${GH_REPO_OWNER:-anonymous}}"

        # Default outputs
        echo "hash=" >> "$GITHUB_OUTPUT"
        echo "permalink=" >> "$GITHUB_OUTPUT"
        echo "status=inconclusive" >> "$GITHUB_OUTPUT"
        echo "badge-snippet=" >> "$GITHUB_OUTPUT"

        STATUS="inconclusive"
        EXIT=0
        # Initialise so the summary block is safe under `set -u` in modes that
        # never assign them (e.g. manifest/guard without registry anchoring).
        HASH=""
        PERMALINK=""

        case "$PRML_MODE" in
          manifest)
            if [ -z "$PRML_MANIFEST_PATH" ]; then
              echo "::error::mode=manifest requires the 'manifest-path' input."
              exit 2
            fi
            if [ ! -f "$PRML_MANIFEST_PATH" ]; then
              echo "::error::manifest not found at $PRML_MANIFEST_PATH"
              exit 2
            fi
            VARGS=("$PRML_MANIFEST_PATH")
            [ -n "$PRML_EXPECTED_HASH" ] && VARGS+=(--expected-hash "$PRML_EXPECTED_HASH")
            [ -n "$PRML_OBSERVED" ] && VARGS+=(--observed "$PRML_OBSERVED")
            echo "::group::falsify verify $PRML_MANIFEST_PATH"
            falsify verify "${VARGS[@]}"
            EXIT=$?
            echo "::endgroup::"
            HASH=$(falsify hash "$PRML_MANIFEST_PATH" 2>/dev/null || true)
            [ -n "$HASH" ] && echo "hash=$HASH" >> "$GITHUB_OUTPUT"
            case "$EXIT" in
              0)  STATUS="pass" ;;
              10) STATUS="fail" ;;
              3)  STATUS="tamper" ;;
              *)  STATUS="inconclusive" ;;
            esac
            ;;

          guard)
            echo "::group::falsify-engine guard (scanning all claims)"
            falsify-engine guard
            EXIT=$?
            echo "::endgroup::"
            case "$EXIT" in
              0)  STATUS="pass" ;;
              10) STATUS="fail" ;;
              3)  STATUS="tamper" ;;
              *)  STATUS="inconclusive" ;;
            esac
            ;;

          verdict)
            if [ -z "$PRML_CLAIM" ]; then
              echo "::error::mode=verdict requires the 'claim' input."
              exit 2
            fi
            echo "::group::falsify-engine verdict $PRML_CLAIM"
            falsify-engine verdict "$PRML_CLAIM"
            EXIT=$?
            echo "::endgroup::"

            # Hash the locked spec for output
            LOCKED=".falsify/${PRML_CLAIM}/spec.lock.json"
            if [ -f "$LOCKED" ]; then
              HASH=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("hash",""))' "$LOCKED" 2>/dev/null || true)
              if [ -n "$HASH" ]; then
                echo "hash=$HASH" >> "$GITHUB_OUTPUT"
              fi

              # Compare against expected-hash if set
              if [ -n "$PRML_EXPECTED_HASH" ] && [ "$HASH" != "$PRML_EXPECTED_HASH" ]; then
                echo "::error::Hash mismatch — expected $PRML_EXPECTED_HASH, got $HASH"
                STATUS="tamper"
                echo "status=tamper" >> "$GITHUB_OUTPUT"
                exit 3
              fi
            fi

            case "$EXIT" in
              0)  STATUS="pass" ;;
              10) STATUS="fail" ;;
              3)  STATUS="tamper" ;;
              *)  STATUS="inconclusive" ;;
            esac
            ;;

          lock)
            if [ -z "$PRML_CLAIM" ]; then
              echo "::error::mode=lock requires the 'claim' input."
              exit 2
            fi
            echo "::group::falsify-engine lock $PRML_CLAIM"
            falsify-engine lock "$PRML_CLAIM"
            EXIT=$?
            echo "::endgroup::"
            STATUS="pass"
            [ "$EXIT" -ne 0 ] && STATUS="inconclusive"
            ;;

          schema-only)
            if [ -z "$PRML_MANIFEST_PATH" ]; then
              echo "::error::mode=schema-only requires the 'manifest-path' input."
              exit 2
            fi
            if [ ! -f "$PRML_MANIFEST_PATH" ]; then
              echo "::error::manifest not found at $PRML_MANIFEST_PATH"
              exit 2
            fi
            case "$PRML_SCHEMA_VERSION" in
              v0.1)      SCHEMA_URL="https://spec.falsify.dev/schema/prml-v0.1.schema.json" ;;
              v0.2-rfc)  SCHEMA_URL="https://spec.falsify.dev/schema/prml-v0.2.schema.json" ;;
              *)         echo "::error::Unknown schema-version '$PRML_SCHEMA_VERSION'. Use v0.1 or v0.2-rfc."
                         exit 2 ;;
            esac
            echo "::group::Schema validation ($PRML_SCHEMA_VERSION) against $PRML_MANIFEST_PATH"
            python "$ACTION_PATH/scripts/schema_validate.py" "$SCHEMA_URL" "$PRML_MANIFEST_PATH" "$PRML_SCHEMA_VERSION"
            EXIT=$?
            echo "::endgroup::"
            case "$EXIT" in
              0)  STATUS="pass" ;;
              10) STATUS="fail" ;;
              *)  STATUS="inconclusive" ;;
            esac
            ;;

          *)
            echo "::error::Unknown mode '$PRML_MODE'. Use manifest / guard / verdict / lock / schema-only."
            exit 2
            ;;
        esac

        echo "status=$STATUS" >> "$GITHUB_OUTPUT"

        # Optional: anchor to public registry (best-effort, non-fatal)
        # Which file to anchor: an explicit PRML manifest (mode=manifest or
        # schema-only) wins; otherwise the engine claim's spec (verdict/lock).
        ANCHOR_PATH=""
        if [ -n "$PRML_MANIFEST_PATH" ]; then
          ANCHOR_PATH="$PRML_MANIFEST_PATH"
        elif [ -n "$PRML_CLAIM" ]; then
          ANCHOR_PATH=".falsify/${PRML_CLAIM}/spec.yaml"
        fi
        if [ "$PRML_ANCHOR" = "true" ] && [ -z "$ANCHOR_PATH" ]; then
          echo "::warning::anchor-to-registry=true but neither manifest-path nor claim is set; nothing to anchor"
        fi
        if [ "$PRML_ANCHOR" = "true" ] && [ "$STATUS" != "tamper" ] && [ -n "$ANCHOR_PATH" ]; then
          MANIFEST_PATH="$ANCHOR_PATH"
          REG_OK=0
          case "$PRML_REGISTRY" in
            https://*) REG_OK=1 ;;
            *) echo "::warning::registry-url must start with https:// (got '$PRML_REGISTRY'); skipping registry anchor" ;;
          esac
          if [ "$REG_OK" = "1" ] && [ ! -f "$MANIFEST_PATH" ]; then
            echo "::warning::anchor-to-registry: $MANIFEST_PATH not found; skipping registry anchor"
          fi
          if [ "$REG_OK" = "1" ] && [ -f "$MANIFEST_PATH" ]; then
            echo "::group::Anchor to ${PRML_REGISTRY}"
            ANCHOR_OUT=$(python "$ACTION_PATH/scripts/anchor.py" "$MANIFEST_PATH" "$PRML_REGISTRY" "$HANDLE" 2>&1 || true)
            echo "$ANCHOR_OUT"
            echo "::endgroup::"
            HASH=$(echo "$ANCHOR_OUT" | grep '^hash=' | cut -d= -f2- | tr -d '\r\n')
            PERMALINK=$(echo "$ANCHOR_OUT" | grep '^permalink=' | cut -d= -f2- | tr -d '\r\n')
            # Harden before writing to $GITHUB_OUTPUT: hash must be 64 hex chars,
            # permalink must be an https URL. Reject anything else (output injection).
            printf '%s' "$HASH" | grep -qE '^[0-9a-f]{64}$' || HASH=""
            case "$PERMALINK" in https://*) : ;; *) PERMALINK="" ;; esac
            if [ -n "$HASH" ]; then
              echo "hash=$HASH" >> "$GITHUB_OUTPUT"
              echo "permalink=$PERMALINK" >> "$GITHUB_OUTPUT"
              SHORT=$(echo "$HASH" | cut -c1-12)
              SNIPPET="[![PRML locked · ${SHORT}](${PRML_REGISTRY}/badge/${HASH}.svg)](${PERMALINK})"
              echo "badge-snippet=$SNIPPET" >> "$GITHUB_OUTPUT"
            fi
          fi
        fi

        # Surface a clean summary in the GitHub Actions UI
        {
          echo "## PRML Verify"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| Mode | \`$PRML_MODE\` |"
          [ -n "$PRML_CLAIM" ] && echo "| Claim | \`$PRML_CLAIM\` |"
          echo "| Status | \`$STATUS\` |"
          [ -n "$HASH" ] && echo "| Hash | \`$HASH\` |"
          [ -n "$PERMALINK" ] && echo "| Permalink | $PERMALINK |"
        } >> "$GITHUB_STEP_SUMMARY"

        exit $EXIT

    - name: Prepare PRML attestation
      id: attest-prep
      if: ${{ inputs.attest == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PRML_MODE: ${{ inputs.mode }}
        PRML_MANIFEST_PATH: ${{ inputs.manifest-path }}
      run: |
        set -euo pipefail
        if [ "$PRML_MODE" != "manifest" ] || [ -z "$PRML_MANIFEST_PATH" ]; then
          echo "::error::attest=true needs mode=manifest and manifest-path"
          exit 2
        fi
        OUT="$RUNNER_TEMP/prml-attest"
        mkdir -p "$OUT"
        python - "$PRML_MANIFEST_PATH" "$OUT" <<'PY' >> "$GITHUB_OUTPUT"
        import json, os, sys
        import falsify_prml as p
        path, out = sys.argv[1], sys.argv[2]
        m = p.load_manifest(path)
        stmt = p.to_intoto_statement(m)
        canon = p.canonicalize(m).encode("utf-8")
        subject = os.path.join(out, os.path.basename(path) + ".canonical")
        with open(subject, "wb") as fh:
            fh.write(canon)
        pred = os.path.join(out, "predicate.json")
        with open(pred, "w", encoding="utf-8") as fh:
            json.dump(stmt["predicate"], fh, sort_keys=True)
        print(f"subject-path={subject}")
        print(f"predicate-path={pred}")
        print(f"predicate-type={stmt['predicateType']}")
        print(f"hash={p.manifest_hash(m)}")
        PY

    - name: Attest PRML manifest
      id: attest
      if: ${{ inputs.attest == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-path: ${{ steps.attest-prep.outputs.subject-path }}
        predicate-type: ${{ steps.attest-prep.outputs.predicate-type }}
        predicate-path: ${{ steps.attest-prep.outputs.predicate-path }}
