name: 'PRML Verify'
description: 'Verify PRML commitments in CI. Block merges on tampered or regressed eval claims. Optional public registry anchor.'
author: 'Cüneyt Öztürk'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  mode:
    description: |
      Verification mode:
      - "manifest": verify a PRML manifest's SHA-256 (hash/tamper) and, if
        `observed` is set, evaluate the predicate. Requires `manifest-path`.
        This is the PRML-manifest verifier — runs the `falsify` reference CLI.
        Exit 0 PASS · 3 TAMPERED (hash mismatch) · 10 FAIL (below threshold).
      - "guard" (default): scan all .falsify/ claims via the workflow engine,
        fail on any FAIL/STALE.
      - "verdict": check one engine claim by name (requires `claim` input).
      - "lock": hash and freeze an engine claim (rare in CI).
      - "schema-only": validate a PRML YAML against the v0.1 / v0.2-RFC JSON
        Schema (shape only, no hash). Requires `manifest-path`.
      Note: guard/verdict/lock drive the `falsify-engine` workflow CLI;
      manifest/schema-only operate on a standalone `*.prml.yaml`.
    required: false
    default: 'guard'

  claim:
    description: 'Claim name (required when mode=verdict or mode=lock)'
    required: false
    default: ''

  manifest-path:
    description: |
      Path to a PRML manifest YAML (required when mode=manifest or
      mode=schema-only). Relative to working-directory.
    required: false
    default: ''

  observed:
    description: |
      Observed metric value (mode=manifest). If set, the action evaluates the
      manifest's predicate and exits 10 (FAIL) if it does not hold.
    required: false
    default: ''

  schema-version:
    description: |
      PRML schema version to validate against in mode=schema-only.
      One of: "v0.1" (default, stable) or "v0.2-rfc" (open through 2026-05-22).
    required: false
    default: 'v0.1'

  expected-hash:
    description: |
      Expected SHA-256 hash to verify against. If set and the computed hash
      mismatches, the action exits 3 (TAMPER). Useful to pin a specific
      registry-anchored claim across CI runs.
    required: false
    default: ''

  anchor-to-registry:
    description: |
      If "true", also POST the canonical manifest to the public registry
      (default: registry.falsify.dev) and surface the permalink as an output.
      Defaults to "false" — only enable when you want a public receipt.
    required: false
    default: 'false'

  registry-url:
    description: 'Public PRML registry endpoint (used only when anchor-to-registry=true).'
    required: false
    default: 'https://registry.falsify.dev'

  registry-handle:
    description: 'Submitter handle to attach to the registry commit (defaults to GitHub repo owner).'
    required: false
    default: ''

  python-version:
    description: 'Python version used to run falsify.'
    required: false
    default: '3.11'

  falsify-version:
    description: 'Version of the single `falsify` PyPI package, pinned for reproducibility (default: 0.3.0). That one package provides both commands used here: the `falsify` PRML CLI and the `falsify-engine` command. There is no separate `falsify-engine` package to install.'
    required: false
    default: '0.3.0'

  working-directory:
    description: 'Path to the repository root that contains .falsify/.'
    required: false
    default: '.'

outputs:
  hash:
    description: 'SHA-256 digest of the canonical manifest bytes.'
    value: ${{ steps.run.outputs.hash }}
  permalink:
    description: 'Registry permalink (only set when anchor-to-registry=true and registry POST succeeded).'
    value: ${{ steps.run.outputs.permalink }}
  status:
    description: 'Final status: pass / fail / tamper / inconclusive.'
    value: ${{ steps.run.outputs.status }}
  badge-snippet:
    description: 'Markdown snippet for embedding the registry badge in a README.'
    value: ${{ steps.run.outputs.badge-snippet }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install falsify ${{ inputs.falsify-version }}
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        pip install --quiet "falsify==${{ inputs.falsify-version }}" jsonschema pyyaml
        falsify --version

    - name: Verify
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PRML_MODE: ${{ inputs.mode }}
        PRML_CLAIM: ${{ inputs.claim }}
        PRML_EXPECTED_HASH: ${{ inputs.expected-hash }}
        PRML_MANIFEST_PATH: ${{ inputs.manifest-path }}
        PRML_OBSERVED: ${{ inputs.observed }}
        PRML_SCHEMA_VERSION: ${{ inputs.schema-version }}
        PRML_ANCHOR: ${{ inputs.anchor-to-registry }}
        PRML_REGISTRY: ${{ inputs.registry-url }}
        PRML_HANDLE: ${{ inputs.registry-handle }}
        GH_REPO_OWNER: ${{ github.repository_owner }}
      run: |
        set -uo pipefail

        # Resolve handle (input wins, otherwise GitHub repo owner)
        HANDLE="${PRML_HANDLE:-${GH_REPO_OWNER:-anonymous}}"

        # Default outputs
        echo "hash=" >> "$GITHUB_OUTPUT"
        echo "permalink=" >> "$GITHUB_OUTPUT"
        echo "status=inconclusive" >> "$GITHUB_OUTPUT"
        echo "badge-snippet=" >> "$GITHUB_OUTPUT"

        STATUS="inconclusive"
        EXIT=0

        case "$PRML_MODE" in
          manifest)
            if [ -z "$PRML_MANIFEST_PATH" ]; then
              echo "::error::mode=manifest requires the 'manifest-path' input."
              exit 2
            fi
            if [ ! -f "$PRML_MANIFEST_PATH" ]; then
              echo "::error::manifest not found at $PRML_MANIFEST_PATH"
              exit 2
            fi
            VARGS=("$PRML_MANIFEST_PATH")
            [ -n "$PRML_EXPECTED_HASH" ] && VARGS+=(--expected-hash "$PRML_EXPECTED_HASH")
            [ -n "$PRML_OBSERVED" ] && VARGS+=(--observed "$PRML_OBSERVED")
            echo "::group::falsify verify $PRML_MANIFEST_PATH"
            falsify verify "${VARGS[@]}"
            EXIT=$?
            echo "::endgroup::"
            HASH=$(falsify hash "$PRML_MANIFEST_PATH" 2>/dev/null || true)
            [ -n "$HASH" ] && echo "hash=$HASH" >> "$GITHUB_OUTPUT"
            case "$EXIT" in
              0)  STATUS="pass" ;;
              10) STATUS="fail" ;;
              3)  STATUS="tamper" ;;
              *)  STATUS="inconclusive" ;;
            esac
            ;;

          guard)
            echo "::group::falsify-engine guard (scanning all claims)"
            falsify-engine guard
            EXIT=$?
            echo "::endgroup::"
            case "$EXIT" in
              0)  STATUS="pass" ;;
              10) STATUS="fail" ;;
              3)  STATUS="tamper" ;;
              *)  STATUS="inconclusive" ;;
            esac
            ;;

          verdict)
            if [ -z "$PRML_CLAIM" ]; then
              echo "::error::mode=verdict requires the 'claim' input."
              exit 2
            fi
            echo "::group::falsify-engine verdict $PRML_CLAIM"
            falsify-engine verdict "$PRML_CLAIM"
            EXIT=$?
            echo "::endgroup::"

            # Hash the locked spec for output
            LOCKED=".falsify/${PRML_CLAIM}/spec.lock.json"
            if [ -f "$LOCKED" ]; then
              HASH=$(python -c "import json,sys; d=json.load(open('$LOCKED')); print(d.get('hash',''))" 2>/dev/null || true)
              if [ -n "$HASH" ]; then
                echo "hash=$HASH" >> "$GITHUB_OUTPUT"
              fi

              # Compare against expected-hash if set
              if [ -n "$PRML_EXPECTED_HASH" ] && [ "$HASH" != "$PRML_EXPECTED_HASH" ]; then
                echo "::error::Hash mismatch — expected $PRML_EXPECTED_HASH, got $HASH"
                STATUS="tamper"
                echo "status=tamper" >> "$GITHUB_OUTPUT"
                exit 3
              fi
            fi

            case "$EXIT" in
              0)  STATUS="pass" ;;
              10) STATUS="fail" ;;
              3)  STATUS="tamper" ;;
              *)  STATUS="inconclusive" ;;
            esac
            ;;

          lock)
            if [ -z "$PRML_CLAIM" ]; then
              echo "::error::mode=lock requires the 'claim' input."
              exit 2
            fi
            echo "::group::falsify-engine lock $PRML_CLAIM"
            falsify-engine lock "$PRML_CLAIM"
            EXIT=$?
            echo "::endgroup::"
            STATUS="pass"
            [ "$EXIT" -ne 0 ] && STATUS="inconclusive"
            ;;

          schema-only)
            if [ -z "$PRML_MANIFEST_PATH" ]; then
              echo "::error::mode=schema-only requires the 'manifest-path' input."
              exit 2
            fi
            if [ ! -f "$PRML_MANIFEST_PATH" ]; then
              echo "::error::manifest not found at $PRML_MANIFEST_PATH"
              exit 2
            fi
            case "$PRML_SCHEMA_VERSION" in
              v0.1)      SCHEMA_URL="https://spec.falsify.dev/schema/prml-v0.1.schema.json" ;;
              v0.2-rfc)  SCHEMA_URL="https://spec.falsify.dev/schema/prml-v0.2.schema.json" ;;
              *)         echo "::error::Unknown schema-version '$PRML_SCHEMA_VERSION'. Use v0.1 or v0.2-rfc."
                         exit 2 ;;
            esac
            echo "::group::Schema validation ($PRML_SCHEMA_VERSION) against $PRML_MANIFEST_PATH"
            python "${{ github.action_path }}/scripts/schema_validate.py" "$SCHEMA_URL" "$PRML_MANIFEST_PATH" "$PRML_SCHEMA_VERSION"
            EXIT=$?
            echo "::endgroup::"
            case "$EXIT" in
              0)  STATUS="pass" ;;
              10) STATUS="fail" ;;
              *)  STATUS="inconclusive" ;;
            esac
            ;;

          *)
            echo "::error::Unknown mode '$PRML_MODE'. Use manifest / guard / verdict / lock / schema-only."
            exit 2
            ;;
        esac

        echo "status=$STATUS" >> "$GITHUB_OUTPUT"

        # Optional: anchor to public registry (best-effort, non-fatal)
        if [ "$PRML_ANCHOR" = "true" ] && [ "$STATUS" != "tamper" ] && [ -n "$PRML_CLAIM" ]; then
          MANIFEST_PATH=".falsify/${PRML_CLAIM}/spec.yaml"
          if [ -f "$MANIFEST_PATH" ]; then
            echo "::group::Anchor to ${PRML_REGISTRY}"
            ANCHOR_OUT=$(python "${{ github.action_path }}/scripts/anchor.py" "$MANIFEST_PATH" "$PRML_REGISTRY" "$HANDLE" 2>&1 || true)
            echo "$ANCHOR_OUT"
            echo "::endgroup::"
            HASH=$(echo "$ANCHOR_OUT" | grep '^hash=' | cut -d= -f2-)
            PERMALINK=$(echo "$ANCHOR_OUT" | grep '^permalink=' | cut -d= -f2-)
            if [ -n "$HASH" ]; then
              echo "hash=$HASH" >> "$GITHUB_OUTPUT"
              echo "permalink=$PERMALINK" >> "$GITHUB_OUTPUT"
              SHORT=$(echo "$HASH" | cut -c1-12)
              SNIPPET="[![PRML locked · ${SHORT}](${PRML_REGISTRY}/badge/${HASH}.svg)](${PERMALINK})"
              echo "badge-snippet=$SNIPPET" >> "$GITHUB_OUTPUT"
            fi
          fi
        fi

        # Surface a clean summary in the GitHub Actions UI
        {
          echo "## PRML Verify"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| Mode | \`$PRML_MODE\` |"
          [ -n "$PRML_CLAIM" ] && echo "| Claim | \`$PRML_CLAIM\` |"
          echo "| Status | \`$STATUS\` |"
          [ -n "$HASH" ] && echo "| Hash | \`$HASH\` |"
          [ -n "$PERMALINK" ] && echo "| Permalink | $PERMALINK |"
        } >> "$GITHUB_STEP_SUMMARY"

        exit $EXIT
